<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora - Shopping Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="Style Velora.css">
    
    <style>
        body {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        .text-gold { color: #d1b86c !important; }
        .btn-velora-gold {
            background-color: #d1b86c; border-color: #d1b86c; color: black;
            text-transform: uppercase; font-weight: bold; border-radius: 0;
        }
        .btn-velora-gold:hover { background-color: #bfa55a; border-color: #bfa55a; }
        .cart-card {
            background-color: #111111;
            border: 1px solid #333;
            border-radius: 8px;
        }
        .summary-card {
            background-color: #161616;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
        }
    </style>
</head>
<body class="bg-black text-white">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3 border-bottom border-secondary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-gold tracking-widest" href="index Velora.html">VELORA</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="index Velora.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="shop Velora.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="women Velora.html">Women</a></li>
                    <li class="nav-item"><a class="nav-link" href="men Velora.html">Men</a></li>
                    <li class="nav-item"><a class="nav-link" href="kids Velora.html">Kids</a></li>
                    <li class="nav-item"><a class="nav-link" href="new-arrivals Velora.html">New arrivals</a></li>
                </ul>
                
                <div class="d-flex align-items-center gap-3">
                    <div class="input-group input-group-sm" style="width: 150px;">
                        <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Search...">
                    </div>
                    <a href="login Velora.html" class="text-white fs-5" title="تسجيل الدخول"><i class="bi bi-person"></i></a>
                    <a href="wishlist Velora.html" class="text-white fs-5" title="المفضلة"><i class="bi bi-heart"></i></a>
                    <a href="cart Velora.html" class="text-gold fs-5 position-relative" title="السلة">
                        <i class="bi bi-cart3"></i>
                        <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark" style="font-size: 0.65rem;">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- PAGE HEADER -->
    <div class="container my-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index Velora.html" class="text-gold text-decoration-none">Home</a></li>
                <li class="breadcrumb-item active text-white-50" aria-current="page">Shopping Cart</li>
            </ol>
        </nav>
        <h2 class="fw-bold text-uppercase border-bottom border-secondary pb-2 text-white">Shopping Cart 🛒</h2>
    </div>

    <!-- CART CONTENT -->
    <div class="container my-5">
        <div class="row g-4">
            
            <!-- قائمة المنتجات الديناميكية -->
            <div class="col-lg-8">
                <div class="d-flex flex-column gap-3" id="cart-items-container">
                    <!-- سيتم تعبئة المنتجات هنا تلقائياً عبر JavaScript -->
                </div>
            </div>

            <!-- ملخص الطلب الديناميكي -->
            <div class="col-lg-4">
                <div class="summary-card p-4">
                    <h5 class="fw-bold text-gold border-bottom border-secondary pb-3 mb-3">Order Summary</h5>
                    
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-white-50">Subtotal</span>
                        <span class="fw-semibold" id="summary-subtotal">0.00 EGP</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-white-50">Shipping Cost</span>
                        <span class="text-success fw-semibold">Free</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-white-50">Tax (Estimated)</span>
                        <span class="fw-semibold" id="summary-tax">0.00 EGP</span>
                    </div>

                    <hr class="border-secondary">

                    <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
                        <span>Total</span>
                        <span class="text-gold" id="summary-total">0.00 EGP</span>
                    </div>

                    <button class="btn btn-velora-gold w-100 py-2 fw-bold text-uppercase" onclick="proceedToCheckout()">
                      Proceed to Checkout
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        function getCart() {
            return JSON.parse(localStorage.getItem('veloraCart')) || [];
        }

        function saveCart(cart) {
            localStorage.setItem('veloraCart', JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            const cart = getCart();
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-badge');
            
            // تحديث الـ Badge فوق أيقونة السلة
            const totalItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (badge) badge.innerText = totalItemsCount;

            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="cart-card p-5 text-center text-muted">
                        <i class="bi bi-cart-x fs-1 text-gold mb-3 d-block"></i>
                        <h5>Your cart is empty!</h5>
                        <p class="small text-white-50">Explore our sections and add your favorite items to the cart.</p>
                        <a href="shop Velora.html" class="btn btn-velora-gold mt-2">Shop Now</a>
                    </div>
                `;
                updateSummary(0);
                return;
            }

            let subtotal = 0;

            cart.forEach((item, index) => {
                // استخراج الرقم فقط من السعر (مثل "650EGP" أو "$89.99" -> 650 أو 89.99)
                let cleanPrice = parseFloat(item.price.replace(/[^0-9.]/g, '')) || 0;
                let itemTotal = cleanPrice * item.quantity;
                subtotal += itemTotal;

                container.innerHTML += `
                    <div class="cart-card p-3 d-flex align-items-center justify-content-between flex-wrap gap-3">
                        <div class="d-flex align-items-center gap-3">
                            <img src="${item.image || 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500&q=80'}" style="width: 80px; height: 90px; object-fit: cover;" class="rounded" alt="${item.name}">
                            <div>
                                <h6 class="fw-bold mb-1 text-white">${item.name}</h6>
                                <p class="text-white-50 mb-1 small">Velora Collection</p>
                                <span class="text-gold fw-bold">${item.price}</span>
                            </div>
                        </div>
                        
                        <div class="d-flex align-items-center gap-3">
                            <div class="input-group input-group-sm" style="width: 110px;">
                                <button class="btn btn-outline-secondary text-white" onclick="changeQuantity(${index}, -1)">-</button>
                                <input type="text" class="form-control text-center bg-dark text-white border-secondary" value="${item.quantity}" readonly>
                                <button class="btn btn-outline-secondary text-white" onclick="changeQuantity(${index}, 1)">+</button>
                            </div>
                            <button class="btn btn-outline-danger btn-sm" onclick="removeItem(${index})" title="حذف المنتج"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            updateSummary(subtotal);
        }

        function changeQuantity(index, delta) {
            let cart = getCart();
            cart[index].quantity += delta;
            if (cart[index].quantity < 1) {
                cart[index].quantity = 1;
            }
            saveCart(cart);
        }

        function removeItem(index) {
            let cart = getCart();
            cart.splice(index, 1);
            saveCart(cart);
        }

        function updateSummary(subtotal) {
            let tax = subtotal > 0 ? 15.00 : 0.00; // قيمة تقديرية للضرائب
            let total = subtotal > 0 ? subtotal + tax : 0.00;

            document.getElementById('summary-subtotal').innerText = subtotal.toFixed(2) + " EGP";
            document.getElementById('summary-tax').innerText = tax.toFixed(2) + " EGP";
            document.getElementById('summary-total').innerText = total.toFixed(2) + " EGP";
        }

        function proceedToCheckout() {
            let cart = getCart();
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }
            alert('Redirecting to Checkout Page.. Thank you for shopping with VELORA!');
        }

        // تشغيل الدالة عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', renderCart);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <footer class="bg-black text-white text-center py-4 border-top border-secondary mt-5">
        <div class="container">
            <p class="mb-1 text-white-50">
               All Rights Reserved &copy; 2026 For Website <span class="text-gold fw-bold">VELORA</span>
            </p>
            <p class="mb-0 fs-6">
               Developed and Designed by 💻 ✨ 
                <span class="text-gold fw-bold border-bottom border-warning pb-1 ms-1">
                   Eman Ahmad
                </span>
            </p>
        </div>
    </footer>
    
</body>
</html>
