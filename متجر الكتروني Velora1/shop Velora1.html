<script>
    function sortProducts() {
        const sortValue = document.getElementById('sortSelect').value;
        const productsContainer = document.getElementById('products-container'); // حاوية المنتجات الكبرى التي تضم كل الكروت
        if (!productsContainer) return;

        // نحول كروت المنتجات إلى مصفوفة (Array) لكي نستطيع ترتيبها
        const productCards = Array.from(productsContainer.getElementsByClassName('product-card')); // تأكدي أن كل كارت منتج يحمل الكلاس product-card

        productCards.sort((a, b) => {
            // نستخرج السعر ونحفره كرقم (Number)
            const priceA = parseFloat(a.getAttribute('data-price')) || 0;
            const priceB = parseFloat(b.getAttribute('data-price')) || 0;
            
            // استخراج تاريخ أو مؤشر الأحدث (لو متوفر)
            const idA = parseInt(a.getAttribute('data-id')) || 0;
            const idB = parseInt(b.getAttribute('data-id')) || 0;

            if (sortValue === 'low-high') {
                return priceA - priceB; // من الأرخص للأعلى
            } else if (sortValue === 'high-low') {
                return priceB - priceA; // من الأعلى للأرخص
            } else if (sortValue === 'newest') {
                return idB - idA; // الأحدث أولاً
            }
        });

        // إعادة إدراج الكروت مرتبة داخل الحاوية
        productCards.forEach(card => productsContainer.appendChild(card));
    }
</script>

<script>
    function viewProduct(name, price, image) {
        const product = { name: name, price: price, image: image };
        localStorage.setItem('selectedProduct', JSON.stringify(product));
