<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora - Women's Section</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="Style Velora.css">
    
    <style>
        body { background-color: #000000 !important; color: #ffffff !important; }
        .bg-black { background-color: #000000 !important; }
        .text-gold { color: #d1b86c !important; }
        .btn-velora-gold {
            background-color: #d1b86c; border-color: #d1b86c; color: black;
            text-transform: uppercase; font-weight: bold; border-radius: 0;
        }
        .btn-velora-gold:hover { background-color: #bfa55a; border-color: #bfa55a; }
        .product-card { background-color: #111; border: 1px solid #444; border-radius: 0; }
        .product-img { height: 260px; object-fit: cover; width: 100%; background-color: #222; }
    </style>
</head>
<body class="bg-black text-white">

    <!-- NAVBAR (مربوط بكل الصفحات بدقة تامة: هوم، شوب، وومنز، مينز، كيدز، لوجن،فيفرت، كارت) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black py-3 border-bottom border-secondary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 text-gold tracking-widest" href="index Velora1.html">VELORA</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="index Velora1.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="shop Velora1.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link active text-gold" href="women Velora1.html">Women</a></li>
                    <li class="nav-item"><a class="nav-link" href="men Velora1.html">Men</a></li>
                    <li class="nav-item"><a class="nav-link" href="kids Velora1.html">Kids</a></li>
                </ul>
                
                <div class="d-flex align-items-center gap-3">
                    <div class="input-group input-group-sm">
                        <input id="search-input" type="text" class="form-control bg-dark text-white border-secondary" placeholder="Search (e.g. dress, skirt)...">
                    </div>
                    <a href="login Velora.html" class="text-white fs-5" title="login"><i class="bi bi-person"></i></a>
                    <a href="wishlist Velora.html" class="text-white fs-5" title="favourite"><i class="bi bi-heart"></i></a>
                    <a href="cart Velora1.html" class="text-white fs-5" title="cart"><i class="bi bi-cart3"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- PAGE HEADER -->
    <div class="container my-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index Velora1.html" class="text-gold text-decoration-none">Home</a></li>
                <li class="breadcrumb-item active text-white-50" aria-current="page">Women's Section</li>
            </ol>
        </nav>
        <h2 class="fw-bold text-uppercase border-bottom border-secondary pb-2 text-white">Women's Clothing & Fashion</h2>
    </div>

    <!-- PRODUCTS GRID -->
    <div class="container my-5">
        <div class="row row-cols-1 row-cols-md-3 g-4" id="women-products-grid">
            <!-- المنتجات ستظهر هنا ديناميكياً -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
               const womenProducts = [
            { name: "Linen Blend Sundress", image_url: "https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=600&auto=format&fit=crop&q=80", price: "780EGP" },
            { name: "Silk Blend Skirt", image_url: "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?w=600&auto=format&fit=crop&q=80", price: "400EGP" },
            { name: "Elegant Black Dress", image_url: "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=600&auto=format&fit=crop&q=80", price: "1100EGP" },
            { name: "Summer Floral Dress", image_url: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=600&auto=format&fit=crop&q=80", price: "950EGP" },
            { name: "Casual Pink Top", image_url: "https://images.unsplash.com/photo-1485968579580-b6d095142e6e?w=600&auto=format&fit=crop&q=80", price: "450EGP" },
            { name: "Classic Evening Gown", image_url: "https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=600&auto=format&fit=crop&q=80", price: "1450EGP" },
            { name: "Knitted Winter Cardigan", image_url: "https://images.unsplash.com/photo-1434389677669-e08b4cac3105?w=600&auto=format&fit=crop&q=80", price: "890EGP" },
            { name: "Chic Velvet Jumpsuit", image_url: "https://images.unsplash.com/photo-1509631179647-0177331693ae?w=600&auto=format&fit=crop&q=80", price: "1250EGP" }
        ];

        const grid = document.getElementById('women-products-grid');

        function renderWomenProducts(products) {
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><h5>No products found matching your search.</h5></div>';
                return;
            }
            products.forEach(product => {
                grid.innerHTML += `
                    <div class="col">
                        <div class="product-card p-3 shadow-sm h-100 d-flex flex-column justify-content-between">
                            <div>
                                <img src="${product.image_url}" class="product-img mb-3" alt="${product.name}" loading="lazy">
                                <div class="product-details text-start text-white text-uppercase" style="font-size: 0.8rem;">
                                    <h6 class="fw-semibold mb-1 text-white text-truncate">${product.name}</h6>
                                    <div class="rating mb-1 text-gold">
                                        <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
                                    </div>
                                    <p class="price fw-bold text-white mb-2" style="font-size: 1rem;">${product.price}</p>
                                </div>
                            </div>
                            
                            <div class="d-flex gap-2 mt-2">
                                <button class="btn btn-velora-gold w-75 rounded-0" onclick="alert('Added to Cart Successfully')">Add to Cart</button>
                                <button class="btn btn-outline-warning w-25 rounded-0" style="border-color: #d1b86c; color: #d1b86c;" onclick="addToWishlist('${product.name}', '${product.price}', '${product.image_url}')" title="أضف للمفضلة">
                                   <i class="bi bi-heart"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        renderWomenProducts(womenProducts);

        // حفظ وحفظ المفضلة والانتقال لصفحة wishlist Velora.html
        function addToWishlist(productName, productPrice, productImg) {
            let wishlist = JSON.parse(localStorage.getItem('veloraWishlist')) || [];
            const exists = wishlist.some(item => item.name === productName);
            if (!exists) {
                wishlist.push({ name: productName, price: productPrice, image: productImg });
                localStorage.setItem('veloraWishlist', JSON.stringify(wishlist));
            }
            window.location.href = 'wishlist Velora.html';
        }

        // كود البحث (الفلترة الفورية للأسم والكلمات المفتاحية)
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', function(e) {
                const term = e.target.value.toLowerCase().trim();
                const filtered = womenProducts.filter(p => p.name.toLowerCase().includes(term));
                renderWomenProducts(filtered);
            });
        }
    </script>

    <footer class="bg-black text-white text-center py-4 border-top border-secondary mt-5">
        <div class="container">
            <p class="mb-1 text-white-50">All Rights Reserved &copy; 2026 For Website <span class="text-gold fw-bold">VELORA</span></p>
            <p class="mb-0 fs-6">Developed and Designed by 💻 ✨ <span class="text-gold fw-bold border-bottom border-warning pb-1 ms-1">Eman Ahmad</span></p>
        </div>
    </footer>

    <script>
    function viewProduct(name, price, image) {
        const product = { name: name, price: price, image: image };
        localStorage.setItem('selectedProduct', JSON.stringify(product));
        window.location.href = 'product-details Velora.html';
    }
</script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // نختار كل كروت المنتجات في الصفحة
        const productCards = document.querySelectorAll('.product-card');

        productCards.forEach(card => {
            // جعل كارت المنتج بأكمله قابلاً للنقر وتغيير شكل الماوس ليد
            card.style.cursor = 'pointer';

            card.addEventListener('click', function(e) {
                // منع الضغط إذا كان المستخدم يضغط على زر "Add to Cart" أو "Wishlist" لكي لا ينتقل بالغلط
                if (e.target.closest('button')) return;

                // استخراج بيانات المنتج من داخل الكارت الحالي تلقائياً
                const nameElement = card.querySelector('h6, h5, .product-title');
                const priceElement = card.querySelector('.price');
                const imgElement = card.querySelector('img');

                const name = nameElement ? nameElement.innerText.trim() : 'Product Name';
                const price = priceElement ? priceElement.innerText.trim() : '0 EGP';
                const image = imgElement ? imgElement.src : '';

                // حفظ البيانات في الذاكرة والانتقال لصفحة التفاصيل
                const product = { name: name, price: price, image: image };
                localStorage.setItem('selectedProduct', JSON.stringify(product));
                
                window.location.href = 'product-details Velora1.html';
            });
        });
    });
</script>

</body>
